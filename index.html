<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Shop Home</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        header { background: #333; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        header nav a { color: white; margin-left: 20px; text-decoration: none; }
        .hero { background: #f4f4f4; padding: 60px 20px; text-align: center; }
        .hero h1 { margin-bottom: 10px; }
        .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 40px 20px; }
        .product-card { border: 1px solid #ddd; padding: 15px; border-radius: 5px; text-align: center; }
        .product-card img { max-width: 100%; height: 200px; object-fit: cover; background: #eee; margin-bottom: 15px; }
        .btn { display: inline-block; background: #ff5722; color: white; padding: 10px 15px; text-decoration: none; border-radius: 3px; margin-top: 10px; }
        footer { background: #222; color: white; text-align: center; padding: 20px; margin-top: 40px; }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="logo"><h2>QuickShop</h2></div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Cart (0)</a>
        </nav>
    </header>

    <!-- Hero / Banner Section -->
    <section class="hero">
        <h1>New Season Arrivals</h1>
        <p>Discover the latest trends with up to 50% off.</p>
        <a href="#" class="btn">Shop Now</a>
    </section>

    <!-- Product Grid -->
    <main class="products">
        <!-- Product 1 -->
        <div class="product-card">
            <img src="https://placeholder.com" alt="Product Image">
            <h3>Classic Backpack</h3>
            <p>$49.99</p>
            <a href="#" class="btn">Add to Cart</a>
        </div>

        <!-- Product 2 -->
        <div class="product-card">
            <img src="https://placeholder.com" alt="Product Image">
            <h3>Wireless Headphones</h3>
            <p>$129.99</p>
            <a href="#" class="btn">Add to Cart</a>
        </div>

        <!-- Product 3 -->
        <div class="product-card">
            <img src="https://placeholder.com" alt="Product Image">
            <h3>Minimalist Watch</h3>
            <p>$89.99</p>
            <a href="#" class="btn">Add to Cart</a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 QuickShop. All rights reserved.</p>
    </footer>

</body>
</html>
